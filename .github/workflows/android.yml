# push·PR마다: 단위 테스트 → 개발용 빌드 → 정식 빌드(R8 줄이기까지, 서명 없이). "내 컴퓨터에선 되는데"를 막는다.
# Play 자동 업로드(CD)는 Play Console API 권한(서비스 계정)이 생기면 이 뒤에 붙인다.
name: Android 테스트·빌드

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest

      - name: 개발용 빌드
        run: ./gradlew assembleDebug

      - name: 정식 빌드(R8, 서명 없이)
        # 정식 빌드는 https 서버 주소가 있어야 통과한다(build.gradle.kts의 검사)
        run: ./gradlew bundleRelease -PAPI_BASE_URL=https://${{ vars.PUBLIC_HOST }}/

      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
